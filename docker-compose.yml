
services:

  # ─── API FastAPI ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aitools_api
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./.env:/app/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://aitools:aitools@postgres:5432/aitools
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aitools_net

  # ─── Celery Worker (tâches rapides) ──────────────────────────────────────────
  worker_fast:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aitools_worker_fast
    command: celery -A core.celery_app worker --queues=fast --concurrency=2 --loglevel=info
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./.env:/app/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://aitools:aitools@postgres:5432/aitools
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - aitools_net

  # ─── Celery Worker (tâches lentes : whisper, demucs…) ────────────────────────
  worker_slow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aitools_worker_slow
    command: celery -A core.celery_app worker --queues=slow --concurrency=1 --loglevel=info
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./.env:/app/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://aitools:aitools@postgres:5432/aitools
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - aitools_net

  # ─── Celery Beat (tâches planifiées : nettoyage fichiers…) ───────────────────
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aitools_beat
    command: celery -A core.celery_app beat --loglevel=info
    volumes:
      - ./.env:/app/.env
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - aitools_net

  # ─── Flower (dashboard monitoring Celery) ────────────────────────────────────
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aitools_flower
    command: celery -A core.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - aitools_net

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aitools_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - aitools_net

  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aitools_postgres
    environment:
      POSTGRES_DB: aitools
      POSTGRES_USER: aitools
      POSTGRES_PASSWORD: aitools
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitools"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - aitools_net

volumes:
  redis_data:
  postgres_data:

networks:
  aitools_net:
    driver: bridge
