[alembic]
# Chemin vers les scripts de migration
script_location = alembic

# L'URL est surchargée dans env.py depuis core.config.settings
# (pas besoin de dupliquer ici — sécurité : pas de secrets dans ce fichier)
sqlalchemy.url = postgresql://aitools:aitools@localhost:5432/aitools

# Template pour les fichiers de migration
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Timezone pour les noms de fichiers
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
